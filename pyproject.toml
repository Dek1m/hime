[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hime"
version = "0.1.0"
description = "Hime — Mass Google Scraper with Proxy Rotation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "httpx[socks]>=0.27.0",
    "selectolax>=0.3.21",
    "redis>=5.0.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
hime = "hime.cli.commands:app"

# === KEY ===
# Пакет лежит в корне рядом с pyproject.toml.
# find_packages(where=".") сканирует текущую директорию,
# находит __init__.py и собирает пакет hime.
[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
